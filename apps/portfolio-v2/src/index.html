<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="description" content="Pubudu Wijesooriya" />
    <meta name="keywords" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <script>
      (function () {
        var month = new Date().getMonth() + 1;
        var season =
          month <= 3 || month === 12
            ? 'winter'
            : month <= 8
              ? 'spring'
              : 'fall';
        var label = season.charAt(0).toUpperCase() + season.slice(1);
        var narrow = window.matchMedia('(max-width: 767px)').matches;
        var file =
          label + '_Banner-poster-' + (narrow ? 'mobile' : 'desktop') + '.webp';
        var path = 'portfolio/landing-page/banners/' + season + '/' + file;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('fetchpriority', 'high');
        link.href =
          'https://firebasestorage.googleapis.com/v0/b/portfolio-c9b8e.firebasestorage.app/o/' +
          encodeURIComponent(path) +
          '?alt=media';
        document.head.appendChild(link);
      })();
    </script>
    <title>Pubudu Wijesooriya</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=add,admin_panel_settings,arrow_right_alt,article,cancel,celebration,check_circle,clear,close,code,content_copy,delete,document_scanner,edit,language,logout,more,ondemand_video,photo,preview,save,screenshot_monitor,upload&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <portfolio-v2-root></portfolio-v2-root>
  </body>
</html>
