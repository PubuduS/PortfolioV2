<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Pubudu Wijesooriya" />
    <meta name="keywords" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <script>
      (function () {
        var month = new Date().getMonth() + 1;
        var season =
          month <= 3 || month === 12
            ? 'winter'
            : month <= 8
              ? 'spring'
              : 'fall';
        var label = season.charAt(0).toUpperCase() + season.slice(1);
        var narrow = window.matchMedia('(max-width: 767px)').matches;
        var file =
          label + '_Banner-poster-' + (narrow ? 'mobile' : 'desktop') + '.webp';
        var path = 'portfolio/landing-page/banners/' + season + '/' + file;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('fetchpriority', 'high');
        link.href =
          'https://firebasestorage.googleapis.com/v0/b/portfolio-c9b8e.firebasestorage.app/o/' +
          encodeURIComponent(path) +
          '?alt=media';
        document.head.appendChild(link);
      })();
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.1/TweenMax.min.js"
      integrity="sha512-bhcsCMe81HHWSpPwSB3iX7CP3ypfhlP9zFJMxB6Fk2SPPrY3+UYBYWcCoSVuDI7cMfFUXHuhzB4lXZfFLc32tA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <link
