name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: false

jobs:
  unit-and-lint:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Use npm 12.2.1
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Provide a local environment file
        run: cp apps/portfolio-v2/src/environments/environment.emulator.ts apps/portfolio-v2/src/environments/environment.ts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use npm 12.2.1
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Provide a local environment file
        run: cp apps/portfolio-v2/src/environments/environment.emulator.ts apps/portfolio-v2/src/environments/environment.ts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e-tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            dist/.playwright
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  compodoc:
    name: Build Compodoc
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Use npm 12.2.1
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Provide a local environment file
        run: cp apps/portfolio-v2/src/environments/environment.emulator.ts apps/portfolio-v2/src/environments/environment.ts

      - name: Build documentation
        run: npm run compodoc

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation

  pages:
    name: Publish Compodoc
    needs: compodoc
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
