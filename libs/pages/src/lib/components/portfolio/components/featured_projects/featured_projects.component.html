<div class="featured-projects-container">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="section-title">
          <h2>Featured Projects</h2>
        </div>
        <div class="featured-project">
          <ul class="row">
            @for (project of featuredProjectCards(); track $index) {
              <li class="col-md-12 fadeUp" data-t-show="3">
                <figure>
                  <img [src]="project.imageURL" alt="img" />
                  <figcaption>
                    <h3>{{ project.heading }}</h3>
                    <p>{{ project.description }}</p>
                    <span
                      >Tools: <strong>{{ project.tools }}</strong></span
                    >
                    <ul class="links">
                      <li>
                        <portfolio-v2-project-link-icon
                          [disabled]="project.gitDisable"
                          [href]="project.githubURL"
                          [icon]="icons.githubIco"
                          alt="git"
                          [tooltip]="icons.gitIcoTooltip"
                        />
                      </li>
                      <li>
                        <portfolio-v2-project-link-icon
                          [disabled]="project.demoDisable"
                          [href]="project.demoURL"
                          [icon]="icons.videoIco"
                          alt="share"
                          [tooltip]="icons.videoIcoTooltip"
                        />
                      </li>
                      <li>
                        <portfolio-v2-project-link-icon
                          [disabled]="project.docDisable"
                          [href]="project.documentationURL"
                          [icon]="icons.documentIco"
                          alt="file"
                          [tooltip]="icons.documentationIcoTooltip"
                        />
                      </li>
                      <li>
                        <portfolio-v2-project-link-icon
                          [disabled]="project.ssDisable"
                          [href]="project.screenshotURL"
                          [icon]="icons.screenshotIco"
                          alt="cut"
                          [tooltip]="icons.screenshotIcoTooltip"
                        />
                      </li>
                    </ul>
                  </figcaption>
                </figure>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
