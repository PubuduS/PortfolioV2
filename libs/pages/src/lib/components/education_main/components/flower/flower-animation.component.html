<div class="flower-container">
  <svg
    #frame
    id="flower-frame"
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 641.5 637.3"
  >
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feFlood flood-color="teal" result="color" />
        <feGaussianBlur in="SourceAlpha" stdDeviation="40" result="blurred" />
        <feComposite in="color" in2="blurred" operator="in" />
        <feMerge>
          <feMergeNode />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    <image
      [attr.href]="iconLink"
      width="128"
      height="128"
      x="50%"
      y="50%"
      transform="translate(-64, -64)"
      filter="url(#glow)"
      (click)="goToPage()"
    />
    <text
      x="50%"
      y="70%"
      text-anchor="middle"
      font-size="36"
      fill="white"
      font-family="Arial, sans-serif"
      (click)="goToPage()"
    >
      {{ title }}
    </text>
  </svg>
</div>
