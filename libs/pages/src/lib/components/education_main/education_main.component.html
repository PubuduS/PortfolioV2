<div
  class="pw-main-section education-full"
  id="section_6"
  data-anchor="education"
>
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="section-title">
          <h2>EDUCATION AND CREDENTIALS</h2>
        </div>
      </div>
      <div class="col-md-4 left">
        <portfolio-v2-flower-animation
          iconLink="assets/images/education/book-icon.png"
          title="Publications"
          [routerPath]="publicationsPath"
        ></portfolio-v2-flower-animation>
      </div>

      <div class="col-md-4 middle">
        <portfolio-v2-flower-animation
          iconLink="assets/images/education/education-university-icon.png"
          title="Education"
          [routerPath]="degreesPath"
        ></portfolio-v2-flower-animation>
      </div>

      <div class="col-md-4 right">
        <portfolio-v2-flower-animation
          iconLink="assets/images/education/certificate-icon.png"
          title="Certifications"
          [routerPath]="certificatesPath"
        ></portfolio-v2-flower-animation>
      </div>
    </div>
  </div>
</div>
