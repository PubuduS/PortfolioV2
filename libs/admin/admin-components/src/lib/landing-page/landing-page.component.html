<div class="landing">
  <div class="content d-flex justify-content-center col-12">
    <div class="col-12 text-center">
      <div class="row mb-3">
        <div class="col-12 mt-3">
          <h2>Landing Page</h2>
        </div>
      </div>
      <div class="row d-flex justify-content-center mt-5">
        <form [formGroup]="landingnForm!">
          <div class="admin-form col-12 px-5 text-center">
            @for (asset of bannerAssets; track asset.suffix) {
              <div class="row mb-3 d-flex justify-content-center">
                <div class="col-12 col-md-6">
                  <label class="form-label" [attr.for]="asset.suffix">{{
                    asset.label
                  }}</label>
                  <input
                    [id]="asset.suffix"
                    type="file"
                    class="form-control"
                    [accept]="asset.accept"
                    (change)="onBannerFile(asset.suffix, $event)"
                  />
                </div>
              </div>
            }

            <div class="row mb-3 d-flex justify-content-center">
              <div class="col-12 col-md-6">
                <select
                  name="seasons"
                  class="form-select"
                  formControlName="seasonsPicker"
                >
                  <option value="winter">Winter</option>
                  <option value="spring">Spring</option>
                  <option value="fall">Fall</option>
                </select>
              </div>
            </div>

            <div class="row mb-3 d-flex justify-content-center">
              <mat-progress-bar
                class="col-12 col-md-6"
                mode="determinate"
                [value]="progressValue"
              ></mat-progress-bar>
            </div>

            <div class="row mb-3 d-flex justify-content-center">
              <div class="col-12 col-md-6">
                <span
                  >File Upload Progress:
                  {{ progressValue | number: '2.2-2' }}%</span
                >
                @if (isUploadCompleted) {
                  <mat-icon class="mx-1">check_circle</mat-icon>
                }
              </div>
            </div>

            <div class="row mb-3 d-flex justify-content-center">
              <div class="col-12 col-md-6">
                <button
                  class="btn btn-primary"
                  type="button"
                  [disabled]="!hasSelectedFile"
                  (click)="startUpload()"
                >
                  Upload
                </button>
              </div>
            </div>

            <div class="row d-flex justify-content-center">
              <div class="col-12">
                <img
                  class="imagePreview mt-3"
                  [src]="imagePreview"
                  alt="Banner still preview"
                />
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
