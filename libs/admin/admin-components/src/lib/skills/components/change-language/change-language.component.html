<div class="change-language p-5">
  <div class="container d-flex justify-content-center">
    <div class="w-100">
      <div class="text-center mb-4">
        <h2>Change Languages</h2>
      </div>
      <form (submit)="$event.preventDefault()">
        <textarea
          class="form-control"
          rows="6"
          [formField]="languageForm.languages"
        ></textarea>
        @if (hasError(languageForm.languages, 'required')) {
          <span class="field-error text-center"
            >A valid languages are required</span
          >
        }
      </form>
      <div class="row">
        <div class="col-6">
          <button
            mat-fab
            extended
            color="primary"
            class="float-end mt-5"
            id="save"
            (click)="saveLanguageKeys()"
          >
            <mat-icon>save</mat-icon>
            Save
          </button>
        </div>
        <div class="col-6 mt-5">
          <button
            mat-fab
            extended
            color="warn"
            id="exit"
            [mat-dialog-close]="true"
          >
            <mat-icon>close</mat-icon>
            Exit
          </button>
        </div>
      </div>
      <div class="row">
        @if (isSaveSuccess | async) {
          <div class="col-12 mt-5">
            <mat-icon class="mx-1 success text-center w-100 h-100"
              >check_circle</mat-icon
            >
          </div>
        }
      </div>
    </div>
  </div>
</div>
