<div class="card-model">
  <h1 mat-dialog-title>Add a New Record</h1>
  <form (submit)="$event.preventDefault()">
    <mat-dialog-content class="mat-typography">
      <div class="row">
        <div class="col-6">
          <label class="fw-bold mb-2">New Photo (Click)</label>
          <img [src]="imagePreview()" (click)="cardInput.click()" />
          <input
            type="file"
            #cardInput
            hidden
            class="form-control"
            accept="image/webp"
            (change)="onFileSelected($event)"
          />
        </div>
        <div class="col-6">
          <label class="fw-bold mb-2">Current Photo</label>
          <img src="{{ defaultImageSrc }}" class="img-fluid" />
        </div>
      </div>
      <div class="row my-2 description">
        <admin-project-card-fields
          [heading]="data.type === typeFeatured ? cardAddForm.heading : null"
          [description]="cardAddForm.description"
          [technologies]="cardAddForm.technologies"
          [codebase]="cardAddForm.codebase"
          [youtube]="cardAddForm.youtube"
          [screenshot]="cardAddForm.screenshot"
          [documentation]="cardAddForm.documentation"
          (uploadScreenshot)="openUploadPhotoPanel()"
        />
      </div>
      <!-- Progress Status Section -->
      <div class="row mb-3 d-flex justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div
            class="d-flex align-items-center justify-content-between flex-wrap"
          >
            <span class="progress-label">
              File Upload Progress: {{ progressValue() | number: '2.2-2' }}%
            </span>
            @if (isUploadCompleted()) {
              <mat-icon class="check" title="Upload complete"
                >check_circle</mat-icon
              >
            }
          </div>
          @if (isEditSuccess | async) {
            <div class="mt-2">
              <mat-icon
                class="success w-100 h-100 d-flex justify-content-center"
                title="Changes saved"
                >check_circle</mat-icon
              >
            </div>
          }
        </div>
      </div>
      <div class="buttons d-flex float-end">
        <button
          mat-fab
          extended
          color="primary"
          class="mx-2"
          (click)="addData()"
        >
          <mat-icon>add</mat-icon>
          <span>Add</span>
        </button>
        <button mat-fab extended mat-dialog-close color="accent">
          <mat-icon>cancel</mat-icon>
          <span>Cancel</span>
        </button>
      </div>
    </mat-dialog-content>
  </form>
</div>
