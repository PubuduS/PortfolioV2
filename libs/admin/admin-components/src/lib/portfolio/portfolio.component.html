<div
  class="pw-main-section projects-full"
  id="section_5"
  data-anchor="protfolio"
>
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="section-title">
          <h2>SOME OF MY PROJECTS</h2>
        </div>
        <div class="my-projects">
          <ul>
            @for (project of projectView(); track $index) {
              <li class="bounceOut" data-t-show="4">
                <portfolio-v2-project-tile
                  [imageUrl]="project.imageURL"
                  [heading]="project.viewHeading"
                  [description]="project.viewDescription"
                  [tooltip]="toolTip"
                  (imageClick)="
                    project.id === 1
                      ? goToFeaturedPRojectsPage()
                      : openDialog(project.id)
                  "
                >
                  <admin-update-delete-buttons
                    [config]="{
                      isVerticalLayout: true,
                      deleteButtonDisabled: project.id === 1,
                      editButtonDisabled: false,
                      deleteButtonClick: getDeleteClickHandler(project.id),
                      editButtonClick: getEditClickHandler(project),
                    }"
                  />
                </portfolio-v2-project-tile>
              </li>
            }
            <li class="bounceOut" data-t-show="4">
              <a data-toggle="modal">
                <button mat-button (click)="addNewRecord()">
                  <img
                    src="assets/images/portfolio/add.ico"
                    width="120"
                    height="120"
                    alt="project"
                    [title]="toolTip"
                  />
                </button>

                <h3 class="mt-1">Add</h3>
                <p>Add a New Record</p>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
