<div class="row d-flex justify-content-center g-3">
  <div class="col-12 col-sm-6 col-md-4 d-flex flex-column align-items-center">
    <label class="fw-bold mb-2">New Icon (Click)</label>
    <img
      [src]="previewSrc()"
      (click)="fileInput.click()"
      class="img-fluid rounded cursor-pointer"
      style="max-width: 120px; object-fit: contain"
      alt="New Icon Preview"
    />
    <input
      type="file"
      #fileInput
      hidden
      class="form-control"
      accept="image/webp"
      (change)="fileSelected.emit($event)"
    />
  </div>
  <div class="col-12 col-sm-6 col-md-4 d-flex flex-column align-items-center">
    <label class="fw-bold mb-2">Current Icon</label>
    <img
      [src]="currentSrc()"
      class="img-fluid rounded"
      style="max-width: 120px; object-fit: contain"
      alt="Current Icon"
    />
  </div>
</div>
