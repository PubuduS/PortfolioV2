<h2 mat-dialog-title>{{ data.heading }}</h2>

<mat-dialog-content>
  <ng-container #formHost />

  @if (status(); as current) {
    @if (current.kind === 'error') {
      <p class="save-error" role="alert">{{ current.message }}</p>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    type="button"
    mat-flat-button
    color="primary"
    [disabled]="status().kind === 'saving'"
    (click)="save()"
  >
    Save
  </button>

  <button
    type="button"
    mat-button
    mat-dialog-close
    [disabled]="status().kind === 'saving'"
  >
    Cancel
  </button>
</mat-dialog-actions>
