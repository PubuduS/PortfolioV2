@if (!weatherErr()) {
  <div class="weather-panel">
    <img class="weatherAnim" [src]="weatherIcon()" alt="" />
    <p class="weather-line">
      <span class="weather-info">In Omaha:</span>
      <span class="weather-info">🌡️ {{ weatherData()?.temprature }} F</span>
      <span class="weather-info">🍃 {{ weatherData()?.windSpeed }} mph</span>
      <span class="weather-info">💧 {{ weatherData()?.humidity }}%</span>
      <span class="weather-info">👀 {{ weatherData()?.description }}</span>
    </p>
  </div>
}
